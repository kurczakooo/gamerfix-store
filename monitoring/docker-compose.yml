services:
  # THINK ABOUT LIMITING THE RESOURCES FOR THESE INSTANCES CAUSE THEY ARE HEAVY
  prometheus:
    image: prom/prometheus:latest
    container_name: gamerfix-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      # - node-exporter
      - cadvisor

  # node-exporter:
  #   image: prom/node-exporter:latest
  #   container_name: gamerfix-node-exporter
  #   restart: unless-stopped

  #   command:
  #     - --path.rootfs=/host

  #   volumes:
  #     - /:/host:ro,rslave

  #   expose:
  #     - "9100"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: gamerfix-cadvisor
    restart: unless-stopped

    privileged: true

    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    expose:
      - "8080"

  loki:
    image: grafana/loki:3.7.0
    container_name: gamerfix-loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

    expose:
      - "3100"

  alloy:
    image: grafana/alloy:latest
    container_name: gamerfix-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: gamerfix-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
